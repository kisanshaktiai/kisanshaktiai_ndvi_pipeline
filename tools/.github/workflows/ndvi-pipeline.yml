name: NDVI Pipeline

on:
  push:
    branches:
      - main
      - feature/production-smallholder-intelligence
    paths:
      - 'water_layers.py'
      - 'water_layer_runner.py'
      - 'main.py'
      - 'processor.py'
      - 'raster_utils.py'
      - 'sentinel_search.py'
      - 'tile_grouping.py'
      - 'config.py'
      - 'context_enrichment.py'
      - 'parcel_context.py'
      - 'ndvi_intelligence_writer.py'
      - 'intelligence_runner.py'
      - '.github/workflows/ndvi-pipeline.yml'
  workflow_dispatch:
    inputs:
      backfill:
        description: "Use BACKFILL_DAYS window (re-process history; idempotent)"
        type: boolean
        default: false
      tenant:
        description: "Restrict to one tenant_id (optional)"
        type: string
        default: ""
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ndvi-pipeline
  cancel-in-progress: false

jobs:
  run-ndvi:
    runs-on: ubuntu-latest
    # 90 min was the binding limit at ~400 lands: the job is killed mid-run and
    # the night's observations are lost. GitHub's hard ceiling is 360 min.
    timeout-minutes: 330

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NDVI measurement pipeline
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          if [ -n "${{ github.event.inputs.tenant }}" ]; then ARGS="$ARGS --tenant ${{ github.event.inputs.tenant }}"; fi
          python main.py $ARGS 2>&1 | tee pipeline.log
          exit ${PIPESTATUS[0]}

      - name: Persist governed observed NDVI intelligence
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.tenant }}" ]; then ARGS="$ARGS --tenant ${{ github.event.inputs.tenant }}"; fi
          python intelligence_runner.py $ARGS 2>&1 | tee intelligence.log
          exit ${PIPESTATUS[0]}

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndvi-pipeline-log-${{ github.run_id }}
          path: |
            pipeline.log
            intelligence.log
          retention-days: 30
