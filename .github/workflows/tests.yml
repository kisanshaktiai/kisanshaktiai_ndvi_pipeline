name: Tests

# Runs on every push and PR that touches the pipeline. These tests are
# fully synthetic: they build tiny GeoTIFFs on disk and never contact
# Planetary Computer or Supabase, so they need no secrets and cost nothing.
on:
  push:
    paths:
      - "**.py"
      - "requirements*.txt"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # db.py builds its client at import time; these are never dialled.
      SUPABASE_URL: http://localhost
      SUPABASE_KEY: test-key-not-used
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run regression tests
        run: pytest tests -q
